<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>كراس التحليل البعدي والحساب الشعاعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1730;--bg2:#12254a;--card:#16294f;--tx:#eaf0ff;--mut:#9fb0d3;--gold:#d2ad55;--bd:#2a3f6b;--ok:#4fd1a5;--no:#ff8b7e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(1200px 600px at 50% -10%,#1d3567,var(--bg));color:var(--tx);font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.mut{color:var(--mut);font-size:14px}
.m{unicode-bidi:isolate}sup,sub{font-size:.7em}
/* المكتبة */
#lib{height:100%;overflow:auto;padding:22px 16px 40px;text-align:center}
#lib .sc{color:var(--mut);font-size:14px}
#lib h1{font:700 32px/1.4 Amiri,serif;margin:6px 0 4px;color:#fff}
.shelf{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin:26px auto 14px;max-width:760px}
.bk{width:200px;text-align:center}
.cover{aspect-ratio:595/842;border-radius:4px 10px 10px 4px;overflow:hidden;background:#fff;border-inline-start:10px solid var(--c);box-shadow:0 18px 38px -16px #000;transition:transform .2s}
.bk:hover .cover{transform:translateY(-4px)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.bk b{display:block;margin-top:10px;line-height:1.5}
.prog{height:6px;border-radius:5px;background:var(--bd);margin:6px auto 2px;width:80%;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.stars{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-weight:600;white-space:nowrap;display:inline-block}
.stars.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}
.link{color:var(--mut);font-size:13px;text-decoration:underline}
/* القارئ */
#rd{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.ib{min-width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-size:18px}
.top .t{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--bd)}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:10px;overflow:hidden;touch-action:pan-y}
.stage.z{align-items:flex-start;overflow:auto;touch-action:auto}
.book{position:relative;width:100%;max-width:calc((100vh - 168px)*.7068);max-width:calc((100dvh - 168px)*.7068);aspect-ratio:595/842;perspective:1700px}
.z .book{max-width:min(100%,920px)}
.pg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:3px;box-shadow:0 12px 40px rgba(0,0,0,.45);backface-visibility:hidden;transform-origin:right center}
#fl{z-index:2}
.out{animation:fo .6s cubic-bezier(.5,0,.7,.4) forwards}
.in{animation:fi .6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fo{to{transform:rotateY(100deg);filter:brightness(.7)}}
@keyframes fi{from{transform:rotateY(100deg);filter:brightness(.7)}}
/* عرض صفحتين كالكتاب الحقيقي */
.book.two{max-width:calc((100vh - 168px)*1.4136);max-width:calc((100dvh - 168px)*1.4136);aspect-ratio:1190/842;perspective:2400px}
.z .book.two{max-width:min(100%,1500px)}
.half{position:absolute;top:0;bottom:0;width:50%;background:#fff;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.half.empty{visibility:hidden}
.half img,.face{width:100%;height:100%;object-fit:contain;display:block}
.hr{right:0;border-radius:0 3px 3px 0}.hl{left:0;border-radius:3px 0 0 3px}
.hr::after,.hl::after{content:"";position:absolute;inset:0;pointer-events:none}
.hr::after{background:linear-gradient(to right,rgba(0,0,0,.28),transparent 9%)}
.hl::after{background:linear-gradient(to left,rgba(0,0,0,.28),transparent 9%)}
.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:3;transform-style:preserve-3d}
.leaf.f{left:0;transform-origin:right center}
.leaf.b{right:0;transform-origin:left center}
.face{position:absolute;inset:0;background:#fff;backface-visibility:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.face.bk{transform:rotateY(180deg)}
.leaf.f.go{animation:lf .8s cubic-bezier(.45,.05,.3,1) forwards}
.leaf.b.go{animation:lb .8s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes lf{50%{filter:brightness(.88)}to{transform:rotateY(180deg)}}
@keyframes lb{50%{filter:brightness(.88)}to{transform:rotateY(-180deg)}}
.pager .ib{min-width:44px;height:44px}

.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 10px 12px}
.nav{width:54px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:24px;line-height:1}
.nav:disabled{opacity:.3}
.pageno{min-width:110px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
/* النوافذ */
#ov{position:fixed;inset:0;background:rgba(5,10,25,.72);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{position:relative;width:min(640px,100%);max-height:88dvh;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:18px 18px 0 0;padding:18px 16px 26px}
.sh h2{font:700 22px/1.5 Amiri,serif;margin:0 0 8px;padding-inline-end:44px}
.x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;background:var(--card)}
.sec{margin:10px 0;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.go{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:start}
.chip{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:20px;background:#1f3a6b;border:1px solid var(--gold);font-size:14px}
.qt{font-size:18px;margin:10px 0}
.op{display:block;width:100%;text-align:start;margin:8px 0;padding:11px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--bd);font-size:17px}
.op.ok{background:#12302a;border-color:var(--ok)}
.op.no{background:#3a1d1b;border-color:var(--no)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);border-inline-start:4px solid var(--gold);font-size:15px}
.btn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:12px;background:var(--gold);color:#1b1500;font-weight:700;text-align:center}
.btn.alt{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.big{font:700 44px/1.2 Amiri,serif;text-align:center;color:var(--gold);margin:8px 0}
#toast{position:fixed;inset-inline:0;bottom:84px;margin:auto;width:max-content;max-width:90%;padding:8px 18px;border-radius:20px;background:var(--gold);color:#1b1500;font-weight:600;z-index:9;animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="lib">
  <div class="sc">المدرسة العليا للأساتذة – ملحقة الوادي</div>
  <h1>كراس التحليل البعدي والحساب الشعاعي</h1>
  <div class="sc">المقياس: الأعمال الموجهة (TD) فيزياء 1 · الأستاذ: أنس عبد الصمد بوطهرة</div>
  <p class="mut" style="margin:14px 0 0">اختر كتابك، واقرأ، ثم اختبر نفسك واجمع النجوم</p>
  <div class="shelf" id="shelf"></div>
  <div class="stars" title="نجومك">⭐ <b>0</b></div>
  <p><button class="link" id="reset">مسح تقدّمي ونجومي</button></p>
</section>

<section id="rd" class="hide">
  <header class="top">
    <button class="ib" id="bLib" title="المكتبة">📚</button>
    <button class="ib" id="bToc" title="الفهرس">☰</button>
    <div class="t" id="bt"></div>
    <button class="ib" id="bQz" title="اختبر نفسك">🎯</button>
    <button class="ib" id="bZ" title="تكبير">🔍</button>
    <div class="stars" title="نجومك">⭐ <b>0</b></div>
  </header>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <main class="stage" id="stage">
    <div class="book" id="bk1">
      <img class="pg" id="pg" alt="صفحة من الكراس">
      <img class="pg hide" id="fl" alt="">
    </div>
    <div class="book two hide" id="bk2">
      <div class="half hr"><img id="ir" alt=""></div>
      <div class="half hl"><img id="il" alt=""></div>
      <div class="leaf hide" id="lf"><img class="face" id="lfr" alt=""><img class="face bk" id="lbk" alt=""></div>
    </div>
  </main>
  <nav class="pager" dir="ltr">
    <button class="ib" id="bS" title="صوت قلب الصفحة">🔊</button>
    <button class="nav" id="nx" title="الصفحة التالية">‹</button>
    <div class="pageno" id="pn"></div>
    <button class="nav" id="pv" title="الصفحة السابقة">›</button>
    <button class="ib" id="bV" title="عرض صفحتين">📖</button>
  </nav>
</section>

<div id="ov" class="hide"><div class="sh" id="sh"></div></div>
<div id="toast" class="hide"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const M=t=>t.replace(/\$(.+?)\$/g,'<bdi dir="ltr" class="m">$1</bdi>');
const pad=n=>String(n).padStart(2,"0"),img=n=>"pages/"+pad(n)+".webp",TOTAL=32;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- المحتوى ---------- */
const BOOKS=[
 {id:"a",title:"كراس الفصل الأول: التذكير الرياضي",from:1,to:15,c:"#2e7d6f",secs:[
  {t:"الوحدات والأبعاد",a:1,b:3},
  {t:"استعمال التحليل البعدي",a:4,b:6,q:"dim"},
  {t:"المقادير الفيزيائية والأشعة",a:7,b:10},
  {t:"طرح الأشعة والجداء السلمي",a:11,b:12,q:"vec"},
  {t:"الجداء الشعاعي والمختلط",a:13,b:14,q:"cross"},
  {t:"حساب الارتيابات",a:14,b:15,q:"err"}]},
 {id:"b",title:"سلاسل الأعمال الموجهة مع الحلول",from:16,to:32,c:"#a8832c",secs:[
  {t:"السلسلة 1: التحليل البعدي والحساب الشعاعي",a:16,b:21},
  {t:"السلسلة 2: التحليل البعدي الشامل",a:22,b:24},
  {t:"السلسلة 3: الأشعة والمقادير الفيزيائية",a:25,b:28},
  {t:"السلسلة 4: الطريقة الهندسية في الحساب الشعاعي",a:29,b:32}]}
];
// كل سؤال: [النص، الخيارات (الأول هو الصحيح وتُخلط عند العرض)، -، الشرح]
const QZ={
 dim:{t:"اختبار: التحليل البعدي",q:[
  ["ما بُعد السرعة $v$؟",["$L·T<sup>−1</sup>$","$L·T$","$L<sup>2</sup>·T<sup>−1</sup>$","$M·L·T<sup>−1</sup>$"],"من $v=x/t$ نجد $[v]=L/T=L·T<sup>−1</sup>$."],
  ["ما بُعد القوة (حسب $F=m·a$)؟",["$M·L·T<sup>−2</sup>$","$M·L·T<sup>−1</sup>$","$M·L<sup>2</sup>·T<sup>−2</sup>$","$L·T<sup>−2</sup>$"],"$[F]=[m][a]=M·L·T<sup>−2</sup>$ ووحدتها النيوتن $N=kg·m·s<sup>−2</sup>$."],
  ["في العلاقة $x=A·cos(ωt+φ)$ ما بُعد $ω$؟",["$T<sup>−1</sup>$","$T$","$L·T<sup>−1</sup>$","بلا بُعد"],"وسيط الدالة المثلثية بلا بُعد، فـ $[ωt]=1$ ومنه $[ω]=T<sup>−1</sup>$."],
  ["ما بُعد الطاقة الحركية $E<sub>c</sub>=½·m·v<sup>2</sup>$؟",["$M·L<sup>2</sup>·T<sup>−2</sup>$","$M·L·T<sup>−2</sup>$","$M·L<sup>2</sup>·T<sup>−1</sup>$","$½·M·L<sup>2</sup>·T<sup>−2</sup>$"],"العدد $½$ بلا بُعد، فـ $[E<sub>c</sub>]=[m][v]<sup>2</sup>=M·L<sup>2</sup>·T<sup>−2</sup>$ وهو بُعد الجول."],
  ["أي مما يلي لا يستطيع التحليل البعدي تحديده؟",["القيمة العددية للثابت عديم البعد (مثل $2π$ أو $½$)","تجانس علاقة فيزيائية","شكل قانون بدلالة مقادير معروفة","بُعد مقدار مشتق"],"التحليل البعدي يفحص التجانس ويستنتج شكل القانون، أما الثوابت العددية فتُحدَّد تجريبيًا أو بالحساب النظري."]]},
 vec:{t:"اختبار: الأشعة والجداء السلمي",q:[
  ["أي المقادير التالية شعاعي؟",["التسارع","درجة الحرارة","الكتلة","الشحنة الكهربائية"],"المقادير الشعاعية تُعيَّن بقيمة واتجاه كالسرعة والتسارع والقوة، أما الكتلة والشحنة ودرجة الحرارة فسلمية."],
  ["إذا كان $B=−3A$ فإن الشعاعين:",["متوازيان ومتعاكسان، وطويلة $B$ ثلاثة أضعاف طويلة $A$","متوازيان وفي الاتجاه نفسه","متعامدان","لهما الطويلة نفسها"],"$α=−3<0$ فالاتجاهان متعاكسان، والطويلة $|α|·‖A‖=3‖A‖$."],
  ["شعاع الوحدة المحمول على $A=3i+4j$ هو:",["$(3/5)i+(4/5)j$","$3i+4j$","$(3/7)i+(4/7)j$","$(1/5)(i+j)$"],"$‖A‖=√(3<sup>2</sup>+4<sup>2</sup>)=5$ ومنه $u=A/‖A‖$ وطويلته $1$."],
  ["محصلة شعاعين متعامدين طويلتاهما $3$ و$4$ لها طويلة:",["$5$","$7$","$1$","$12$"],"عند $θ=90°$: $V=√(V<sub>1</sub><sup>2</sup>+V<sub>2</sub><sup>2</sup>)=5$."],
  ["ما قيمة الجداء السلمي لـ $A=2i+3j$ و$B=−3i+2j$ وماذا تستنتج؟",["صفر: الشعاعان متعامدان","صفر: الشعاعان متوازيان","12: متعامدان","−12: متعاكسان"],"$A·B=A<sub>x</sub>B<sub>x</sub>+A<sub>y</sub>B<sub>y</sub>=−6+6=0$ فالشعاعان متعامدان."]]},
 cross:{t:"اختبار: الجداء الشعاعي والمختلط",q:[
  ["اتجاه $A∧B$ هو:",["عمودي على مستوي $A$ و$B$ وجهته بقاعدة اليد اليمنى","في اتجاه $A$","في اتجاه المحصلة $A+B$","يقع في مستوي $A$ و$B$"],"الجداء الشعاعي عمودي على الشعاعين معًا، وجهته تُحدَّد بقاعدة اليد اليمنى (الثلاثي مباشر)."],
  ["$i∧j$ يساوي:",["$k$","$−k$","$0$","$1$"],"في الثلاثي المباشر: $i∧j=k$ و$j∧k=i$ و$k∧i=j$."],
  ["العلاقة بين $A∧B$ و$B∧A$ هي:",["$B∧A=−(A∧B)$","$B∧A=A∧B$","$B∧A=0$","$B∧A=‖A‖‖B‖$"],"الجداء الشعاعي ضديد التبديل: تبديل الترتيب يعكس الجهة."],
  ["طويلة $A∧B$ عندما $A=2i$ و$B=3j$:",["$6$","$5$","$0$","$1$"],"$‖A∧B‖=A·B·sin θ=2×3×sin 90°=6$ وهو مساحة المستطيل الذي ضلعاه $A$ و$B$."],
  ["حجم متوازي السطوح المنشأ على $A$ و$B$ و$C$ يساوي:",["$|A·(B∧C)|$","$‖A‖+‖B‖+‖C‖$","$‖A∧B‖$","$A·B·C$"],"هو القيمة المطلقة للجداء المختلط، أي للمحدد المرتَّب بمركبات الأشعة الثلاثة."]]},
 err:{t:"اختبار: حساب الارتيابات",q:[
  ["قيس طول $l=20$ cm بارتياب مطلق $Δl=0.2$ cm. فالارتياب النسبي:",["$1%$","$10%$","$0.2%$","$4%$"],"$Δl/l=0.2/20=0.01$ أي $1%$."],
  ["في الفرق $G=A−B$ يكون الارتياب المطلق:",["$ΔG=ΔA+ΔB$","$ΔG=ΔA−ΔB$","$ΔG=0$","$ΔG=ΔA·ΔB$"],"في الجمع والطرح تُجمع الارتيابات المطلقة (الحالة الأسوأ)."],
  ["في الجداء $G=A·B$ يكون الارتياب النسبي:",["$ΔG/G=ΔA/A+ΔB/B$","$ΔG/G=ΔA·ΔB$","$ΔG/G=ΔA+ΔB$","$ΔG/G=0$"],"في الجداء والقسمة تُجمع الارتيابات النسبية."]]}
};

/* ---------- الحالة والتخزين ---------- */
let S;try{S=JSON.parse(localStorage.getItem("kurras.v1"))}catch(e){}
S=Object.assign({v:{a:[],b:[]},sec:{},ok:{},best:{},perf:{},last:{},st:0,snd:true},S||{});
const save=()=>{try{localStorage.setItem("kurras.v1",JSON.stringify(S))}catch(e){}};
let BK=null,cur=1,busy=false;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add("hide"),2200)}
function stars(n,why){S.st+=n;save();$$(".stars b").forEach(e=>e.textContent=S.st);
  $$(".stars").forEach(e=>{e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")});toast("⭐ +"+n+" "+why)}

/* ---------- المكتبة ---------- */
function lib(){
  $("#rd").classList.add("hide");$("#lib").classList.remove("hide");
  $("#shelf").innerHTML=BOOKS.map((b,i)=>{const tot=b.to-b.from+1,p=Math.round(S.v[b.id].length/tot*100);
    return `<button class="bk" data-i="${i}"><div class="cover" style="--c:${b.c}"><img src="${img(b.from)}" alt=""></div><b>${b.title}</b><small class="mut">${tot} صفحة · ${p}% مقروء</small><div class="prog"><i style="width:${p}%"></i></div></button>`}).join("");
  $$("#shelf .bk").forEach(e=>e.onclick=()=>openBook(+e.dataset.i));
  $$(".stars b").forEach(e=>e.textContent=S.st);
}
function openBook(i){
  BK=BOOKS[i];nSp=Math.floor((BK.to-BK.from+1)/2)+1;
  $("#lib").classList.add("hide");$("#rd").classList.remove("hide");
  $("#bt").textContent=BK.title;$("#stage").classList.remove("z");
  cur=S.last[BK.id]||BK.from;applyMode();
}

/* ---------- القراءة وقلب الصفحات ---------- */
let two=false,spread=0,nSp=1,AC=null;
// الكتاب عربي: الصفحة الأولى منفردة على اليسار، ثم تتوالى الصفحات المزدوجة (الزوجية يمينًا والفردية يسارًا)
const R=k=>k?BK.from+2*k-1:null;
const L=k=>{const n=k?BK.from+2*k:BK.from;return n>BK.to?null:n};
const spreadOf=n=>Math.floor((n-BK.from+1)/2);
const wantTwo=()=>S.mode?S.mode==="two":innerWidth/innerHeight>1.1;
const setSlot=(el,n)=>{const h=el.parentElement;if(n==null){el.removeAttribute("src");h.classList.add("empty")}else{el.src=img(n);h.classList.remove("empty")}};
const setFace=(el,n)=>{if(n==null)el.removeAttribute("src");else el.src=img(n)};
const shown=()=>two?[R(spread),L(spread)].filter(x=>x!=null):[cur];

function ui(){
  $("#pn").textContent="ص "+shown().join("–")+" من "+TOTAL;
  $("#nx").disabled=two?spread>=nSp-1:cur>=BK.to;
  $("#pv").disabled=two?spread<=0:cur<=BK.from;
  $("#pb").style.width=(S.v[BK.id].length/(BK.to-BK.from+1)*100)+"%";
  S.last[BK.id]=cur;save();
}
function preload(){
  const ns=two?[spread-1,spread+1].flatMap(k=>k>=0&&k<nSp?[R(k),L(k)]:[]):[cur-1,cur+1];
  ns.forEach(n=>{if(n!=null&&n>=BK.from&&n<=BK.to)new Image().src=img(n)});
}
function visit(n){
  const v=S.v[BK.id];if(v.includes(n))return;v.push(n);
  BK.secs.forEach((s,i)=>{const k=BK.id+i;
    if(!S.sec[k]){let all=true;for(let p=s.a;p<=s.b;p++)if(!v.includes(p))all=false;
      if(all){S.sec[k]=1;stars(1,"أكملتَ قراءة: "+s.t)}}});
  save();ui();
}
const visitNow=()=>shown().forEach(visit);

/* صوت قلب الورقة: يُولَّد برمجيًا بلا ملف صوتي */
function flipSound(){
  if(!S.snd)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const sr=AC.sampleRate,len=Math.floor(sr*.62),buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0);
    for(let i=0;i<len;i++){
      const x=i/len,sw=Math.pow(Math.sin(Math.PI*Math.min(1,x/.72)),1.5)*.85,tap=x>.74?Math.exp(-(x-.74)*55)*.9:0;
      d[i]=(Math.random()*2-1)*(sw+tap);
    }
    const src=AC.createBufferSource(),hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),g=AC.createGain();
    src.buffer=buf;hp.type="highpass";hp.frequency.value=700;lp.type="lowpass";lp.frequency.value=5200;g.gain.value=.3;
    src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(AC.destination);src.start();
  }catch(e){}
}

/* صفحة واحدة */
async function go(n,dir){
  if(busy||n<BK.from||n>BK.to||n===cur)return;
  const pg=$("#pg"),fl=$("#fl"),old=pg.src,url=img(n);
  if(!dir||reduce){pg.src=url}
  else{
    busy=true;flipSound();
    if(dir>0){fl.src=old;pg.src=url;fl.className="pg out"}else{fl.src=url;fl.className="pg in"}
    await new Promise(r=>{fl.addEventListener("animationend",r,{once:true});setTimeout(r,900)});
    pg.src=url;fl.className="pg hide";busy=false;
  }
  cur=n;ui();visitNow();preload();
}
/* صفحتان: ورقة تُقلَّب فوق المنتصف */
async function goS(k,dir){
  if(busy||k<0||k>=nSp||k===spread)return;
  const rO=R(spread),lO=L(spread),rN=R(k),lN=L(k),ir=$("#ir"),il=$("#il"),lf=$("#lf");
  if(!dir||reduce){setSlot(ir,rN);setSlot(il,lN)}
  else{
    busy=true;flipSound();
    if(dir>0){setSlot(il,lN);setFace($("#lfr"),lO);setFace($("#lbk"),rN);lf.className="leaf f go"}
    else{setSlot(ir,rN);setFace($("#lfr"),rO);setFace($("#lbk"),lN);lf.className="leaf b go"}
    await new Promise(r=>{lf.addEventListener("animationend",r,{once:true});setTimeout(r,1200)});
    setSlot(ir,rN);setSlot(il,lN);lf.className="leaf hide";busy=false;
  }
  spread=k;cur=k?R(k):BK.from;ui();visitNow();preload();
}
const nextP=()=>two?goS(spread+1,1):go(cur+1,1);   // الكتاب عربي: التالية إلى اليسار
const prevP=()=>two?goS(spread-1,-1):go(cur-1,-1);
const jump=n=>two?goS(spreadOf(n),spreadOf(n)>spread?1:-1):go(n,n>cur?1:-1);

function applyMode(){
  two=wantTwo();
  $("#bk1").classList.toggle("hide",two);$("#bk2").classList.toggle("hide",!two);
  $("#bV").textContent=two?"📖":"📄";$("#bV").title=two?"عرض صفحة واحدة":"عرض صفحتين";
  $("#bS").textContent=S.snd?"🔊":"🔇";
  $("#lf").className="leaf hide";$("#fl").className="pg hide";busy=false;
  if(two){spread=spreadOf(cur);setSlot($("#ir"),R(spread));setSlot($("#il"),L(spread));cur=R(spread)||BK.from}
  else{$("#pg").src=img(cur)}
  ui();visitNow();preload();
}
$("#nx").onclick=nextP;$("#pv").onclick=prevP;
$("#bLib").onclick=lib;
$("#bZ").onclick=()=>$("#stage").classList.toggle("z");
$("#bV").onclick=()=>{S.mode=two?"one":"two";save();applyMode()};
$("#bS").onclick=()=>{S.snd=!S.snd;save();$("#bS").textContent=S.snd?"🔊":"🔇";if(S.snd)flipSound()};
let x0=null;
$("#stage").addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
$("#stage").addEventListener("touchend",e=>{
  if(x0===null||$("#stage").classList.contains("z"))return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>55)dx>0?nextP():prevP();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")return close();
  if(!BK||$("#rd").classList.contains("hide")||!$("#ov").classList.contains("hide"))return;
  if(e.key==="ArrowLeft")nextP();if(e.key==="ArrowRight")prevP();
});
addEventListener("resize",()=>{if(BK&&!S.mode&&!$("#rd").classList.contains("hide")&&wantTwo()!==two)applyMode()});

/* ---------- النوافذ ---------- */
function sheet(h){$("#sh").innerHTML='<button class="x" id="cx" aria-label="إغلاق">✕</button>'+h;$("#ov").classList.remove("hide");$("#cx").onclick=close}
function close(){$("#ov").classList.add("hide")}
$("#ov").onclick=e=>{if(e.target.id==="ov")close()};

$("#bToc").onclick=()=>{
  sheet("<h2>الفهرس</h2>"+BK.secs.map((s,i)=>`<div class="sec"><button class="go" data-p="${s.a}"><span>${S.sec[BK.id+i]?"✅":"📖"} ${s.t}</span><small class="mut">ص ${s.a}–${s.b}</small></button>${s.q?`<button class="chip" data-q="${s.q}">🎯 ${QZ[s.q].t.replace("اختبار: ","")}${S.best[s.q]!=null?" ("+S.best[s.q]+"/"+QZ[s.q].q.length+")":""}</button>`:""}</div>`).join(""));
  $$("#sh .go").forEach(b=>b.onclick=()=>{close();jump(+b.dataset.p)});
  $$("#sh .chip").forEach(b=>b.onclick=()=>quiz(b.dataset.q));
};
$("#bQz").onclick=()=>{
  const ids=BK.secs.filter(s=>s.q).map(s=>s.q);
  if(!ids.length){sheet("<h2>اختبر نفسك</h2><p class='mut'>لا توجد اختبارات في هذا الكتاب، فحلّ التمارين بنفسك أولًا ثم قارن مع الحل المفصّل في الصفحات.</p>");return}
  sheet("<h2>اختبر نفسك</h2><p class='mut'>نجمة عن كل إجابة صحيحة لأول مرة، ونجمتان إضافيتان عند العلامة الكاملة.</p>"+ids.map(id=>`<button class="op" data-q="${id}">🎯 ${QZ[id].t}${S.best[id]!=null?" · أفضل نتيجة "+S.best[id]+"/"+QZ[id].q.length:""}</button>`).join(""));
  $$("#sh .op").forEach(b=>b.onclick=()=>quiz(b.dataset.q));
};

/* ---------- الاختبارات ---------- */
function quiz(id){
  const Z=QZ[id];let i=0,sc=0;
  const step=()=>{
    if(i>=Z.q.length)return end();
    const [t,o,e]=Z.q[i];
    const op=o.map((x,k)=>({x,ok:k===0}));
    for(let k=op.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[op[k],op[j]]=[op[j],op[k]]}
    sheet(`<h2>${Z.t}</h2><div class="mut">السؤال ${i+1} من ${Z.q.length}</div><p class="qt">${M(t)}</p>${op.map((x,k)=>`<button class="op" data-k="${k}">${M(x.x)}</button>`).join("")}<div id="fb" class="fb hide"></div>`);
    $$("#sh .op").forEach(b=>b.onclick=()=>{
      if($("#fb").innerHTML)return;
      const k=+b.dataset.k,good=op[k].ok;
      $$("#sh .op").forEach((c,j)=>{if(op[j].ok)c.classList.add("ok")});
      if(!good)b.classList.add("no");
      if(good){sc++;if(!S.ok[id+i]){S.ok[id+i]=1;stars(1,"إجابة صحيحة")}}
      const f=$("#fb");f.classList.remove("hide");
      f.innerHTML=(good?"✓ إجابة صحيحة. ":"✗ إجابة خاطئة. ")+M(e)+`<button class="btn" id="nq">${i===Z.q.length-1?"عرض النتيجة":"السؤال التالي"}</button>`;
      $("#nq").onclick=()=>{i++;step()};
    });
  };
  const end=()=>{
    if(S.best[id]==null||sc>S.best[id])S.best[id]=sc;
    if(sc===Z.q.length&&!S.perf[id]){S.perf[id]=1;stars(2,"علامة كاملة")}
    save();
    sheet(`<h2>${Z.t}</h2><div class="big">${sc} / ${Z.q.length}</div><p style="text-align:center">${sc===Z.q.length?"أحسنت! علامة كاملة 🌟":sc>=Z.q.length/2?"جيد، راجع الصفحات ثم أعد المحاولة":"راجع الصفحات المتعلقة بالفصل ثم أعد المحاولة"}</p><button class="btn" id="rq">إعادة الاختبار</button><button class="btn alt" id="cq">إغلاق</button>`);
    $("#rq").onclick=()=>quiz(id);$("#cq").onclick=close;
  };
  step();
}

$("#reset").onclick=()=>{if(confirm("هل تريد مسح تقدّمك ونجومك؟")){S={v:{a:[],b:[]},sec:{},ok:{},best:{},perf:{},last:{},st:0,snd:S.snd,mode:S.mode};save();lib()}};
lib();
</script>
</body>
</html>
